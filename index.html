<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#06101f">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="Ocean Food — fast food. Mehrli qullardan samimiy insonlarga.">

    <title>Ocean Food</title>

    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="apple-touch-icon" href="images/favicon.png">

    <link rel="preload" href="fonts/CafeBlock.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="fonts/CafeRound.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="preload" href="images/logo-512.webp" as="image">

    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/shell.css">
    <link rel="stylesheet" href="css/scene.css">
    <link rel="stylesheet" href="css/menu.css">
    <link rel="stylesheet" href="css/cursor.css">

    <script src="https://telegram.org/js/telegram-web-app.js" defer onerror="this.remove()"></script>
</head>
<body>

    <!-- Загрузка: логотип, пока подгружаются шрифты -->
    <div id="boot" aria-hidden="true">
        <img src="images/logo-192.png" alt="" width="132" height="132">
        <div class="boot-wave"><i></i><i></i><i></i></div>
    </div>

    <!-- Touch-след (оранжевый) -->
    <canvas id="swipe-effect" aria-hidden="true"></canvas>

    <!-- Курсор Ocean Food (только мышь) -->
    <div id="custom-cursor" hidden aria-hidden="true">
        <img src="images/cursor-sm.png" alt="" width="46" height="50" draggable="false">
    </div>

    <div id="app">

        <!-- ================= СЦЕНА: ИНТЕРЬЕР ================= -->
        <section id="scene" class="screen is-open" aria-label="Ocean Food">

            <header class="topbar">
                <a class="brand interactive" href="#/" aria-label="Ocean Food">
                    <img src="images/logo-192.png" alt="" width="40" height="40">
                    <span class="brand-text">
                        <b>OCEAN FOOD</b>
                        <i data-i18n="brand.sub">Фастфуд</i>
                    </span>
                </a>
                <div class="topbar-actions">
                    <div data-slot="lang"></div>
                    <div data-slot="cart"></div>
                </div>
            </header>

            <div class="room" id="room">
                <div class="room-wall"></div>
                <div class="room-wainscot"></div>
                <div class="room-floor"></div>

                <div class="stage">

                    <!-- лампы -->
                    <div class="layer layer--lamp-l" style="--d:5"><div class="lamp"><i></i></div></div>
                    <div class="layer layer--lamp-r" style="--d:5"><div class="lamp"><i></i></div></div>

                    <!-- вывеска -->
                    <div class="layer layer--sign" style="--d:7;--i:0">
                        <div class="sign">
                            <img src="images/logo-512.webp" alt="Ocean Foods — Fast Food" width="512" height="512" decoding="async">
                        </div>
                        <p class="sign-slogan" data-i18n="slogan">Mehrli qullardan samimiy insonlarga.</p>
                    </div>

                    <!-- окно к морю -->
                    <div class="layer layer--window" style="--d:11;--i:1" aria-hidden="true">
                        <svg class="window" viewBox="0 0 300 270" role="presentation">
                            <defs>
                                <linearGradient id="w-sky" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="0" stop-color="#7fd0f5"/><stop offset="1" stop-color="#d8f1fb"/>
                                </linearGradient>
                                <linearGradient id="w-sea" x1="0" y1="0" x2="0" y2="1">
                                    <stop offset="0" stop-color="#1b9be0"/><stop offset="1" stop-color="#0b4f86"/>
                                </linearGradient>
                                <linearGradient id="w-wood" x1="0" y1="0" x2="1" y2="1">
                                    <stop offset="0" stop-color="#b87942"/><stop offset="1" stop-color="#6f3f1d"/>
                                </linearGradient>
                                <clipPath id="w-glass"><rect x="22" y="62" width="256" height="190" rx="4"/></clipPath>
                                <pattern id="w-stripe" width="40" height="10" patternUnits="userSpaceOnUse">
                                    <rect width="20" height="10" fill="#e0392b"/><rect x="20" width="20" height="10" fill="#fff2d4"/>
                                </pattern>
                            </defs>
                            <!-- рама -->
                            <rect x="10" y="50" width="280" height="214" rx="10" fill="url(#w-wood)"/>
                            <g clip-path="url(#w-glass)">
                                <rect x="22" y="62" width="256" height="190" fill="url(#w-sky)"/>
                                <circle cx="212" cy="124" r="26" fill="#ffd56b"/>
                                <circle cx="212" cy="124" r="40" fill="#ffd56b" opacity=".25"/>
                                <rect x="22" y="150" width="256" height="110" fill="url(#w-sea)"/>
                                <g class="waves">
                                    <path d="M-60 168 q30 -14 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 v8 h-480z" fill="#46b6ee" opacity=".7"/>
                                    <path d="M-30 196 q30 -14 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 v8 h-480z" fill="#2a8bd0" opacity=".8"/>
                                    <path d="M-60 226 q30 -14 60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 t60 0 v40 h-480z" fill="#0f6aa8" opacity=".9"/>
                                </g>
                                <path d="M22 62 L130 62 L22 160z" fill="#fff" opacity=".18"/>
                            </g>
                            <!-- переплёт -->
                            <rect x="144" y="62" width="12" height="190" fill="url(#w-wood)"/>
                            <rect x="22" y="148" width="256" height="10" fill="url(#w-wood)"/>
                            <rect x="22" y="62" width="256" height="190" rx="4" fill="none" stroke="#3b1f0c" stroke-width="3" opacity=".6"/>
                            <!-- подоконник -->
                            <rect x="0" y="252" width="300" height="18" rx="6" fill="url(#w-wood)"/>
                            <rect x="0" y="252" width="300" height="4" fill="#fff" opacity=".18"/>
                            <!-- маркиза -->
                            <path d="M4 18 H296 L284 60 H16z" fill="url(#w-stripe)"/>
                            <path d="M16 60 q10 12 20 0 q10 12 20 0 q10 12 20 0 q10 12 20 0 q10 12 20 0 q10 12 20 0 q10 12 20 0 q10 12 20 0 q10 12 20 0 q10 12 20 0 q10 12 20 0 q10 12 20 0 q10 12 20 0 z" fill="url(#w-stripe)"/>
                            <rect x="0" y="12" width="300" height="10" rx="5" fill="#8f1d14"/>
                            <path d="M4 18 H296 L284 60 H16z" fill="#000" opacity=".12"/>
                        </svg>
                    </div>

                    <!-- доска меню -->
                    <div class="layer layer--board" style="--d:14;--i:2">
                        <div class="prop hot board" role="button" tabindex="0" data-go="#/menu" data-i18n-aria="hot.board">
                            <span class="board-chains" aria-hidden="true"><i></i><i></i></span>
                            <span class="board-frame">
                                <span class="board-slate">
                                    <span class="board-title" data-i18n="menu.title">Меню</span>
                                    <span class="board-rule" aria-hidden="true"></span>
                                    <ul class="board-list" id="board-list"></ul>
                                </span>
                            </span>
                            <span class="tag"><span data-i18n="hot.board">Меню</span></span>
                        </div>
                    </div>

                    <!-- касса -->
                    <div class="layer layer--counter" style="--d:22;--i:3">
                        <div class="prop hot counter" role="button" tabindex="0" data-go="#/cart" data-i18n-aria="cart.open">
                            <svg class="register" viewBox="0 0 240 200" aria-hidden="true">
                                <defs>
                                    <linearGradient id="r-body" x1="0" y1="0" x2="0" y2="1">
                                        <stop offset="0" stop-color="#f0584a"/><stop offset="1" stop-color="#a81f14"/>
                                    </linearGradient>
                                    <linearGradient id="r-screen" x1="0" y1="0" x2="0" y2="1">
                                        <stop offset="0" stop-color="#16465e"/><stop offset="1" stop-color="#0c2a3d"/>
                                    </linearGradient>
                                </defs>
                                <ellipse cx="120" cy="194" rx="108" ry="8" fill="#000" opacity=".3"/>
                                <!-- дисплей -->
                                <rect x="106" y="86" width="28" height="22" fill="#1b2f4d"/>
                                <rect x="52" y="14" width="136" height="76" rx="12" fill="#0a1830" stroke="#27456b" stroke-width="3"/>
                                <rect x="62" y="24" width="116" height="56" rx="7" fill="url(#r-screen)"/>
                                <text id="till-total" x="170" y="66" text-anchor="end" font-family="Cafe Block, Arial Black, sans-serif" font-size="26" fill="#ffd56b">0</text>
                                <path d="M62 24 H110 L62 60z" fill="#fff" opacity=".07"/>
                                <!-- корпус -->
                                <path d="M14 192 L34 118 Q37 106 50 106 H190 Q203 106 206 118 L226 192 Z" fill="url(#r-body)"/>
                                <path d="M34 118 Q37 106 50 106 H190 Q203 106 206 118 L208 126 H32z" fill="#fff" opacity=".22"/>
                                <g fill="#fff2d4" opacity=".95">
                                    <rect x="60" y="134" width="22" height="14" rx="4"/><rect x="88" y="134" width="22" height="14" rx="4"/>
                                    <rect x="116" y="134" width="22" height="14" rx="4"/><rect x="60" y="154" width="22" height="14" rx="4"/>
                                    <rect x="88" y="154" width="22" height="14" rx="4"/><rect x="116" y="154" width="22" height="14" rx="4"/>
                                </g>
                                <rect x="150" y="134" width="34" height="34" rx="6" fill="#ffb81c"/>
                                <rect x="150" y="134" width="34" height="8" rx="4" fill="#fff" opacity=".35"/>
                                <rect x="52" y="176" width="136" height="6" rx="3" fill="#6e140c"/>
                            </svg>
                            <svg class="bell" viewBox="0 0 70 56" aria-hidden="true">
                                <defs><linearGradient id="b-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe9a0"/><stop offset="1" stop-color="#d7920a"/></linearGradient></defs>
                                <path d="M10 46 Q10 14 35 14 Q60 14 60 46z" fill="url(#b-g)"/>
                                <rect x="4" y="44" width="62" height="8" rx="4" fill="#b87a08"/>
                                <circle cx="35" cy="10" r="5" fill="#b87a08"/>
                            </svg>
                            <span class="counter-slab" aria-hidden="true"></span>
                            <span class="counter-front" aria-hidden="true"></span>
                            <span class="tag"><span data-i18n="hot.till">Касса</span></span>
                        </div>
                    </div>

                    <!-- стол -->
                    <div class="layer layer--table" style="--d:26;--i:4">
                        <div class="prop hot table" role="button" tabindex="0" data-say aria-describedby="say" data-i18n-aria="hot.table">
                            <span class="say" id="say" role="status" data-i18n="table.say">Присаживайтесь! Выбор за вами.</span>
                            <svg viewBox="0 0 400 260" aria-hidden="true">
                                <defs>
                                    <pattern id="t-check" width="36" height="36" patternUnits="userSpaceOnUse">
                                        <rect width="36" height="36" fill="#fff2d4"/><rect width="18" height="18" fill="#e0392b"/><rect x="18" y="18" width="18" height="18" fill="#e0392b"/>
                                    </pattern>
                                    <linearGradient id="t-chair-y" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffcb4d"/><stop offset="1" stop-color="#d9930a"/></linearGradient>
                                    <linearGradient id="t-chair-b" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2aa8ee"/><stop offset="1" stop-color="#0f6aa8"/></linearGradient>
                                    <linearGradient id="t-metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9fb4c8"/><stop offset=".5" stop-color="#e8f1f8"/><stop offset="1" stop-color="#7d93a8"/></linearGradient>
                                </defs>
                                <ellipse cx="200" cy="244" rx="170" ry="12" fill="#000" opacity=".28"/>
                                <!-- левый стул -->
                                <g class="chair chair--l">
                                    <rect x="14" y="52" width="58" height="104" rx="16" fill="url(#t-chair-y)"/>
                                    <rect x="22" y="62" width="14" height="70" rx="7" fill="#fff" opacity=".28"/>
                                    <rect x="8" y="150" width="86" height="20" rx="9" fill="url(#t-chair-y)"/>
                                    <rect x="20" y="168" width="7" height="68" rx="3" fill="#2d3e55"/>
                                    <rect x="72" y="168" width="7" height="68" rx="3" fill="#2d3e55"/>
                                </g>
                                <!-- правый стул -->
                                <g class="chair chair--r">
                                    <rect x="328" y="52" width="58" height="104" rx="16" fill="url(#t-chair-b)"/>
                                    <rect x="364" y="62" width="14" height="70" rx="7" fill="#fff" opacity=".22"/>
                                    <rect x="306" y="150" width="86" height="20" rx="9" fill="url(#t-chair-b)"/>
                                    <rect x="321" y="168" width="7" height="68" rx="3" fill="#2d3e55"/>
                                    <rect x="373" y="168" width="7" height="68" rx="3" fill="#2d3e55"/>
                                </g>
                                <!-- ножка стола -->
                                <rect x="192" y="150" width="16" height="84" fill="url(#t-metal)"/>
                                <ellipse cx="200" cy="238" rx="58" ry="10" fill="url(#t-metal)"/>
                                <!-- столешница -->
                                <ellipse cx="200" cy="140" rx="132" ry="34" fill="#5b3216"/>
                                <ellipse cx="200" cy="132" rx="132" ry="34" fill="url(#t-check)"/>
                                <ellipse cx="200" cy="132" rx="132" ry="34" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>
                                <ellipse cx="170" cy="118" rx="90" ry="14" fill="#fff" opacity=".12"/>
                                <!-- соусы и салфетки -->
                                <g>
                                    <rect x="170" y="78" width="22" height="48" rx="8" fill="#e0392b"/>
                                    <rect x="175" y="68" width="12" height="14" rx="3" fill="#fff2d4"/>
                                    <rect x="174" y="92" width="14" height="14" rx="3" fill="#fff2d4" opacity=".9"/>
                                    <rect x="200" y="82" width="22" height="44" rx="8" fill="#ffb81c"/>
                                    <rect x="205" y="72" width="12" height="14" rx="3" fill="#fff2d4"/>
                                    <rect x="204" y="94" width="14" height="14" rx="3" fill="#fff2d4" opacity=".9"/>
                                    <path d="M240 126 L246 96 H272 L278 126 Z" fill="url(#t-metal)"/>
                                    <path d="M246 96 L252 82 L268 82 L272 96z" fill="#fff"/>
                                </g>
                            </svg>
                            <span class="tag"><span data-i18n="hot.table">Стол</span></span>
                        </div>
                    </div>

                </div>

                <div class="room-vignette" aria-hidden="true"></div>
            </div>

            <footer class="scene-foot">
                <p class="hint" data-i18n="hint.scene">Нажмите на доску, кассу или стол</p>
                <a class="cta interactive" href="#/menu">
                    <span data-i18n="cta.menu">Открыть меню</span>
                    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </a>
            </footer>
        </section>

        <!-- ================= МЕНЮ ================= -->
        <section id="menu" class="screen" aria-label="Меню" inert aria-hidden="true">
            <header class="topbar">
                <button class="icon-btn" type="button" data-back data-i18n-aria="back">
                    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <div class="topbar-actions">
                    <div data-slot="lang"></div>
                    <div data-slot="cart"></div>
                </div>
            </header>
            <div class="scroller" id="menu-scroll">
                <div class="wrap">
                    <div class="page-head">
                        <p class="eyebrow">OCEAN FOOD</p>
                        <h1 data-i18n="menu.title">Меню</h1>
                        <p class="page-sub" data-i18n="menu.sub">Выберите, что хотите</p>
                    </div>
                    <div class="grid" id="menu-grid"></div>
                </div>
            </div>
            <button class="cartbar" id="cartbar" type="button" hidden>
                <span class="cartbar-count" id="cartbar-count">0</span>
                <span class="cartbar-label" data-i18n="cart.bar">Заказ</span>
                <span class="cartbar-total" id="cartbar-total"></span>
            </button>
        </section>

        <!-- ================= ЗАКАЗ ================= -->
        <section id="cart" class="screen" aria-label="Заказ" inert aria-hidden="true">
            <header class="topbar">
                <button class="icon-btn" type="button" data-back data-i18n-aria="back">
                    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <div class="topbar-actions"><div data-slot="lang"></div></div>
            </header>
            <div class="scroller">
                <div class="wrap wrap--narrow">
                    <div class="page-head">
                        <p class="eyebrow">OCEAN FOOD</p>
                        <h1 data-i18n="cart.title">Заказ</h1>
                    </div>
                    <div id="cart-body"></div>
                </div>
            </div>
        </section>

    </div>

    <!-- Лист блюда / модалка заказа -->
    <div id="sheet" class="sheet" hidden>
        <div class="sheet-backdrop" data-sheet-close></div>
        <div class="sheet-panel" role="dialog" aria-modal="true" id="sheet-panel"></div>
    </div>

    <div id="toasts" aria-live="polite"></div>

    <script src="js/dom.js" defer></script>
    <script src="js/data/menu.js" defer></script>
    <script src="js/i18n.js" defer></script>
    <script src="js/store.js" defer></script>
    <script src="js/telegram.js" defer></script>
    <script src="js/router.js" defer></script>
    <script src="js/cursor.js" defer></script>
    <script src="js/scene.js" defer></script>
    <script src="js/menu.js" defer></script>
    <script src="js/cart.js" defer></script>
    <script src="js/app.js" defer></script>
</body>
</html>
