<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ocean Food</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --bg:#050a0e; --panel:rgba(13,21,27,.72); --line:#1c2830;
  --ink:#f4f8f9; --ink-dim:#93a7b0;
  --deep:#0c3752; --foam:#4fa3b8; --accent:#4fa3b8;
  --red:#e2543f; --yellow:#eebd4a; --orange:#e8823f; --green:#5c9f63;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); box-sizing:border-box;
}
*{box-sizing:inherit;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
h1,h2,.dish,.hero-type,.feat-name,.big-word{font-family:'Fraunces',serif;}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--ink-dim);text-transform:uppercase;}

/* fixed living background: real WebGL stage + soft colour wash + foreground particles */
#scene{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 8%,#123b52 0%,#081820 55%,#04080b 100%);}
.glow{position:absolute;border-radius:50%;filter:blur(80px);opacity:.4;transition:background 1.1s ease;animation:drift 28s ease-in-out infinite;}
.glow.g1{width:62vmax;height:62vmax;left:-16vmax;top:-18vmax;background:var(--deep);}
.glow.g2{width:48vmax;height:48vmax;right:-14vmax;bottom:20vh;background:var(--accent);animation-direction:reverse;animation-duration:22s;}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(4%,3%) scale(1.09);}}
#webgl{position:absolute;inset:0;width:100%;height:100%;display:block;}
#particles{position:absolute;inset:0;}
.p{position:absolute;border-radius:50%;opacity:.7;animation:bob 7s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0);}50%{transform:translateY(-18px) rotate(24deg);}}

/* header */
#topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:linear-gradient(rgba(5,10,14,.85),rgba(5,10,14,.55) 70%,transparent);backdrop-filter:blur(6px);}
.mark{font-family:'Fraunces',serif;font-size:17px;font-weight:600;}
#navlinks{display:none;}
#langswitch{display:flex;gap:2px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:3px;}
#langswitch button{font-size:11px;font-weight:600;color:var(--ink-dim);background:none;border:none;padding:6px 11px;border-radius:999px;}
#langswitch button.active{background:var(--deep);color:var(--ink);}
#topbar .tg-mini{width:34px;height:34px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;margin-left:8px;transition:background 1s ease;}
#topbar .tg-mini svg{width:16px;height:16px;fill:#06121a;}
.bar-right{display:flex;align-items:center;}

main{position:relative;z-index:2;}
section{position:relative;padding:0 22px;}

/* hero */
#hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;gap:22px;padding-top:70px;}
.hero-type{font-size:clamp(58px,18vw,148px);line-height:.85;font-weight:600;letter-spacing:-.02em;}
.hero-type i{font-style:normal;color:var(--accent);transition:color 1s ease;}
.slogan{font-size:14.5px;color:var(--ink-dim);font-style:italic;max-width:280px;}
.cta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}
.btn{font-family:'Inter';font-size:13px;font-weight:600;padding:14px 24px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);}
.btn.primary{border:none;background:var(--accent);color:#06121a;transition:background 1s ease;}
.hero-orb{position:absolute;right:-14%;top:14%;width:64vw;max-width:340px;opacity:.9;}
@media(min-width:760px){.hero-orb{right:-4%;top:8%;width:34vw;max-width:420px;}}

/* featured */
#featured{padding:120px 22px 100px;}
.feat-grid{display:grid;gap:26px;position:relative;}
.feat-name{font-size:clamp(40px,11vw,84px);line-height:.92;font-weight:500;}
.feat-price{font-size:clamp(28px,7vw,44px);font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;transition:color 1s ease;}
.feat-desc{color:var(--ink-dim);max-width:340px;font-size:14.5px;line-height:1.6;}
.feat-icon{width:min(70vw,320px);margin:0 auto;filter:drop-shadow(0 24px 40px rgba(0,0,0,.5));}
@media(min-width:760px){.feat-grid{grid-template-columns:1fr 1fr;align-items:center;}.feat-icon{order:-1;margin:0;width:100%;max-width:440px;}}

/* category nav + worlds */
#cat-nav{position:sticky;top:66px;z-index:20;display:flex;gap:7px;overflow-x:auto;padding:10px 0 16px;scrollbar-width:none;background:linear-gradient(rgba(5,10,14,.4),transparent);}
#cat-nav::-webkit-scrollbar{display:none;}
#cat-nav button{flex:0 0 auto;font-size:12.5px;font-weight:500;color:var(--ink-dim);background:rgba(13,21,27,.7);border:1px solid var(--line);padding:9px 15px;border-radius:999px;white-space:nowrap;backdrop-filter:blur(6px);}
#cat-nav button.active{color:#06121a;border-color:transparent;background:var(--accent);font-weight:600;}
.world{min-height:86vh;display:grid;grid-template-columns:1fr;gap:18px;align-items:center;padding:60px 0;text-align:center;}
.world .visual{display:flex;justify-content:center;}
.world .info{display:flex;flex-direction:column;align-items:center;gap:10px;}
.icon-halo{width:min(58vw,220px);aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.16),transparent 60%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 30px 60px -22px rgba(0,0,0,.65);}
.dish-svg{width:72%;height:72%;filter:drop-shadow(0 10px 16px rgba(0,0,0,.35));}
.dish{font-size:clamp(28px,7vw,42px);font-weight:500;}
.price-range{font-size:13px;color:var(--ink-dim);font-weight:500;}
.desc{font-size:13.5px;color:var(--ink-dim);max-width:300px;line-height:1.5;}
.variants{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:320px;}
.variant{font-size:12.5px;font-weight:500;padding:9px 15px;border-radius:999px;border:1px solid var(--line);color:var(--ink-dim);background:rgba(255,255,255,.04);}
.variant.sel{border-color:var(--accent);color:#06121a;background:var(--accent);}
.actions{display:flex;gap:10px;margin-top:2px;}
.btn.small{padding:10px 18px;font-size:12.5px;}
@media(min-width:760px){
  .world{grid-template-columns:1fr 1fr;text-align:left;min-height:78vh;}
  .world .visual{justify-content:flex-start;}
  .world .info{align-items:flex-start;}
  .world .desc,.world .variants{max-width:360px;justify-content:flex-start;}
  .icon-halo{width:min(46vw,320px);}
}

/* full menu grid */
#menu{padding:80px 22px 40px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;backdrop-filter:blur(10px);display:flex;flex-direction:column;gap:6px;}
.card .dish-svg{width:56px;height:56px;}
.card h3{font-family:'Fraunces',serif;font-weight:500;font-size:16px;}
.card .price-range{font-size:12px;}
.card .actions{margin-top:6px;gap:6px;}
.card .btn.small{padding:8px 12px;font-size:11.5px;}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);}}

/* picks (bento) */
#picks{padding:70px 22px 90px;}
.bento{display:grid;grid-template-columns:1fr;gap:14px;margin-top:22px;}
.bento .card.big{grid-column:1/-1;flex-direction:row;align-items:center;gap:16px;}
.bento .card.big .dish-svg{width:100px;height:100px;flex:none;}
@media(min-width:700px){.bento{grid-template-columns:1.3fr 1fr;grid-auto-rows:1fr;}.bento .card.big{grid-row:1/3;flex-direction:column;align-items:flex-start;}.bento .card.big .dish-svg{width:150px;height:150px;}}

/* footer */
footer{padding:90px 22px 60px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;}
footer .big-word{font-size:clamp(38px,11vw,72px);font-weight:600;}
footer .slogan{max-width:300px;}

#tg{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:25;width:52px;height:52px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px -6px rgba(79,163,184,.6);transition:background 1s ease;}
#tg svg{width:22px;height:22px;fill:#06121a;}

.overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(4,8,11,.6);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s ease;}
.overlay.show{opacity:1;pointer-events:auto;}
.sheet{width:100%;max-width:480px;background:#0d151b;border:1px solid var(--line);border-top-left-radius:28px;border-top-right-radius:28px;padding:26px 24px calc(26px + env(safe-area-inset-bottom,0px));transform:translateY(30px);transition:transform .35s cubic-bezier(.2,.8,.2,1);max-height:82vh;overflow-y:auto;}
.overlay.show .sheet{transform:translateY(0);}
.sheet-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.sheet-close{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink-dim);font-size:15px;}
.sheet .icon-halo{width:120px;margin:0 auto 12px;}
.order-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);}
.qty{display:flex;align-items:center;gap:14px;}
.qty button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);font-size:16px;}
.total{font-size:20px;font-weight:600;}
.sheet .btn.primary{width:100%;margin-top:16px;display:flex;align-items:center;justify-content:center;gap:8px;}
</style>
</head>
<body>

<div id="scene">
  <div class="glow g1"></div><div class="glow g2" id="glow2"></div>
  <canvas id="webgl"></canvas>
  <div id="particles"></div>
</div>

<div id="topbar">
  <div class="mark">OCEAN FOOD</div>
  <div class="bar-right">
    <div id="langswitch"><button data-lang="uz">UZ</button><button data-lang="ru">RU</button><button data-lang="en">EN</button></div>
    <a class="tg-mini" href="https://t.me/" target="_blank" rel="noopener" aria-label="Telegram"><svg viewBox="0 0 24 24"><path d="M21.9 2.9 2.4 10.7c-1.3.5-1.3 1.3-.2 1.6l5 1.6 1.9 6c.2.6.5.8.9.8.5 0 .7-.2 1-.5l2.4-2.3 5 3.7c.9.5 1.6.3 1.8-.8l3.3-15.6c.3-1.4-.5-2-1.6-1.3z"/></svg></a>
  </div>
</div>

<main>
  <section id="hero" class="zone" data-accent="#4fa3b8">
    <div class="hero-icon-slot hero-orb" id="heroOrb"></div>
    <div>
      <div class="eyebrow">Jizzakh · Fast Food</div>
      <div class="hero-type">OCEAN<br><i>FOOD</i></div>
    </div>
    <div class="slogan" id="heroSlogan"></div>
    <div class="cta-row">
      <button class="btn primary" id="ctaExplore"></button>
      <button class="btn" id="ctaCats"></button>
    </div>
  </section>

  <section id="featured" class="zone" data-accent="#e8823f">
    <div class="feat-grid">
      <div>
        <div class="eyebrow" id="featEyebrow"></div>
        <div class="feat-name" id="featName"></div>
        <div class="feat-price" id="featPrice"></div>
        <p class="feat-desc" id="featDesc"></p>
        <div class="actions" style="margin-top:16px" id="featActions"></div>
      </div>
      <div class="feat-icon" id="featIcon"></div>
    </div>
  </section>

  <section id="categories">
    <div id="cat-nav"></div>
    <div id="worlds"></div>
  </section>

  <section id="menu">
    <div class="eyebrow">Full menu</div>
    <h2 class="dish" style="font-size:clamp(24px,6vw,34px)">Har bir taom, bir joyda</h2>
    <div class="grid" id="menuGrid"></div>
  </section>

  <section id="picks">
    <div class="eyebrow">Ocean picks</div>
    <h2 class="dish" style="font-size:clamp(24px,6vw,34px)">Eng ko'p tanlanadigan</h2>
    <div class="bento" id="bento"></div>
  </section>

  <footer class="zone" data-accent="#4fa3b8">
    <div class="big-word">OCEAN FOOD</div>
    <div class="slogan">Mehrli qo'llardan samimiy insonlarga.</div>
    <a class="btn primary" href="https://t.me/" target="_blank" rel="noopener">Telegram</a>
    <div class="eyebrow">Jizzakh, Uzbekiston</div>
  </footer>
</main>

<a id="tg" href="https://t.me/" target="_blank" rel="noopener" aria-label="Telegram">
  <svg viewBox="0 0 24 24"><path d="M21.9 2.9 2.4 10.7c-1.3.5-1.3 1.3-.2 1.6l5 1.6 1.9 6c.2.6.5.8.9.8.5 0 .7-.2 1-.5l2.4-2.3 5 3.7c.9.5 1.6.3 1.8-.8l3.3-15.6c.3-1.4-.5-2-1.6-1.3z"/></svg>
</a>

<div class="overlay" id="infoOverlay"><div class="sheet" id="infoSheet"></div></div>
<div class="overlay" id="orderOverlay"><div class="sheet" id="orderSheet"></div></div>

const priceOf = v => typeof v==='number' ? v : v.p;
const labelOf = v => typeof v==='number' ? '' : (typeof v.label==='string' ? v.label : v.label[lang]);
const priceRange = vs => {const p=[...new Set(vs.map(priceOf))].sort((a,b)=>a-b);return p.length>1?fmt(p[0])+' – '+fmt(p[p.length-1]):fmt(p[0]);};

    wrap:`<g transform="rotate(-18 80 80)"><rect x="16" y="56" width="128" height="46" rx="23" fill="${accent}"/><rect x="30" y="65" width="100" height="8" rx="4" fill="#6fae6f" opacity=".85"/><rect x="30" y="78" width="100" height="8" rx="4" fill="#e2543f" opacity=".7"/><rect x="30" y="91" width="100" height="6" rx="3" fill="#eebd4a" opacity=".85"/></g>`,

    doner:`<rect x="76" y="14" width="8" height="132" fill="#8a97a0"/><path d="M80 26 C48 38 44 92 58 132 L102 132 C116 92 112 38 80 26 Z" fill="${accent}"/><path d="M54 58 L106 65 M52 80 L108 87 M54 102 L106 109" stroke="#2b1f16" stroke-width="3" opacity=".45"/>`,

    assorti:`<ellipse cx="80" cy="120" rx="66" ry="16" fill="#0c3752" stroke="${accent}" stroke-width="3"/><rect x="40" y="58" width="80" height="6" rx="3" fill="#8a97a0" transform="rotate(-8 80 61)"/><circle cx="58" cy="80" r="16" fill="${accent}"/><circle cx="86" cy="72" r="14" fill="#e2543f"/><circle cx="110" cy="86" r="13" fill="#e3bd82"/>`,
    drumstick:`<ellipse cx="90" cy="70" rx="46" ry="38" fill="${accent}"/><rect x="70" y="96" width="14" height="42" rx="7" fill="#f3e6cf"/><path d="M58 54 L122 86 M64 76 L116 60" stroke="#5a2c14" stroke-width="4" opacity=".35"/>`,
    fries:`<path d="M32 70 L128 70 L118 132 L42 132 Z" fill="#e2543f"/><rect x="46" y="30" width="10" height="60" rx="4" fill="${accent}" transform="rotate(-7 51 60)"/><rect x="65" y="20" width="10" height="70" rx="4" fill="${accent}"/><rect x="84" y="24" width="10" height="66" rx="4" fill="${accent}" transform="rotate(6 89 57)"/><rect x="102" y="34" width="10" height="56" rx="4" fill="${accent}" transform="rotate(11 107 62)"/>`,
  };
  return `<svg viewBox="0 0 160 160" class="dish-svg">${P[type]||''}</svg>`;
}
const haloIcon = (d,size) => `<div class="icon-halo" style="${size?`width:${size}`:''}">${icon(d.icon,d.accent)}</div>`;

function renderHero(){
  document.getElementById('heroOrb').innerHTML = haloIcon(DATA[0],'100%');

}
function renderFeatured(){

function renderWorlds(){

  nav.innerHTML = DATA.map((d,i)=>`<button data-i="${i}" class="${i===activeCat?'active':''}" style="${i===activeCat?`--accent:${d.accent}`:''}">${d.name[lang].toUpperCase()}</button>`).join('');

        <div class="dish">${d.name[lang]}</div>

        <div class="actions"><button class="btn primary" style="--accent:${d.accent}" data-order="${i}">${t.order}</button><button class="btn small" data-info="${i}">${t.info}</button></div>

function renderMenuGrid(){
  document.getElementById('menuGrid').innerHTML = DATA.map((d,i)=>`
    <div class="card">

      <h3>${d.name[lang]}</h3>

      <div class="actions"><button class="btn small primary" style="--accent:${d.accent}" data-order="${i}">${UI[lang].order}</button><button class="btn small" data-info="${i}">${UI[lang].info}</button></div>
    </div>`).join('');
}
function renderBento(){
  const picks=[6,0,7];
  document.getElementById('bento').innerHTML = picks.map((i,idx)=>{
    const d=DATA[i];
    return `<div class="card ${idx===0?'big':''}">
      ${icon(d.icon,d.accent)}

      <div class="actions"><button class="btn small primary" style="--accent:${d.accent}" data-order="${i}">${UI[lang].order}</button><button class="btn small" data-info="${i}">${UI[lang].info}</button></div></div>

}
function bindActionButtons(){
  document.querySelectorAll('[data-info]').forEach(b=>b.onclick=()=>openInfo(+b.dataset.info));
  document.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>openOrder(+b.dataset.order));
}

function openInfo(i){
  const d=DATA[i], sel=selVariant[i]||0, v=d.variants[sel], t=UI[lang];
  document.getElementById('infoSheet').innerHTML = `
    <div class="sheet-top"><div></div><button class="sheet-close" id="infoClose">✕</button></div>
    ${haloIcon(d,'120px')}
    <div class="dish" style="text-align:center">${d.name[lang]}</div>
    <div class="desc" style="text-align:center;margin:8px auto 14px">${d.desc[lang]}</div>
    <div class="variants" style="margin-bottom:6px">${d.variants.map((vv,vi)=>`<button class="variant ${vi===sel?'sel':''}" style="--accent:${d.accent}" data-vi="${vi}">${fmt(priceOf(vv))}${labelOf(vv)?' · '+labelOf(vv):''}</button>`).join('')}</div>
    <button class="btn primary" style="--accent:${d.accent}" id="infoOrder">${t.order} — ${fmt(priceOf(v))}</button>`;
  document.getElementById('infoSheet').querySelectorAll('.variant').forEach(b=>b.onclick=()=>{selVariant[i]=+b.dataset.vi;renderWorlds();renderMenuGrid();renderBento();bindActionButtons();openInfo(i);});
  document.getElementById('infoClose').onclick=closeInfo;
  document.getElementById('infoOrder').onclick=()=>{closeInfo();openOrder(i);};
  document.getElementById('infoOverlay').classList.add('show');
}
function closeInfo(){document.getElementById('infoOverlay').classList.remove('show');}
function openOrder(i){
  qty=1;
  const draw=()=>{
    const d=DATA[i], sel=selVariant[i]||0, v=d.variants[sel], t=UI[lang], total=priceOf(v)*qty;
    document.getElementById('orderSheet').innerHTML = `
      <div class="sheet-top"><div class="dish" style="font-size:20px">${d.name[lang]}</div><button class="sheet-close" id="orderClose">✕</button></div>
      <div class="desc">${labelOf(v)? labelOf(v)+' · ':''}${fmt(priceOf(v))}</div>
      <div class="order-row"><span>${t.qty}</span><div class="qty"><button id="qm">−</button><span>${qty}</span><button id="qp">+</button></div></div>
      <div class="order-row"><span>${t.total}</span><span class="total">${fmt(total)}</span></div>
      <button class="btn primary" style="--accent:${d.accent}" id="sendTg">${t.send}
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 2.9 2.4 10.7c-1.3.5-1.3 1.3-.2 1.6l5 1.6 1.9 6c.2.6.5.8.9.8.5 0 .7-.2 1-.5l2.4-2.3 5 3.7c.9.5 1.6.3 1.8-.8l3.3-15.6c.3-1.4-.5-2-1.6-1.3z"/></svg>
      </button>`;
    document.getElementById('orderClose').onclick=closeOrder;
    document.getElementById('qm').onclick=()=>{if(qty>1)qty--;draw();};
    document.getElementById('qp').onclick=()=>{qty++;draw();};
    document.getElementById('sendTg').onclick=()=>{
      const msg=`Ocean Food\n${d.name[lang]}${labelOf(v)?' ('+labelOf(v)+')':''} x${qty}\n${t.total}: ${fmt(total)}`;
      window.open('https://t.me/share/url?text='+encodeURIComponent(msg),'_blank');
    };
  };
  draw();
  document.getElementById('orderOverlay').classList.add('show');
}
function closeOrder(){document.getElementById('orderOverlay').classList.remove('show');}

/* real WebGL environment: far/mid/near geometry, independent motion, cursor + scroll parallax */
let scene3,camera3,renderer3,clock3,accentObjs=[],mouseX=0,mouseY=0,scrollT=0,webglOK=false;
function initScene(){
  try{
    const lowPower = innerWidth<700 || (navigator.hardwareConcurrency||4)<=4;
    scene3=new THREE.Scene();
    camera3=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,100);
    camera3.position.set(0,0,13);
    renderer3=new THREE.WebGLRenderer({canvas:document.getElementById('webgl'),antialias:true,alpha:true});
    renderer3.setPixelRatio(Math.min(devicePixelRatio,lowPower?1.3:2));
    renderer3.setSize(innerWidth,innerHeight);
    scene3.add(new THREE.AmbientLight(0x224455,1.1));
    const key=new THREE.DirectionalLight(0xffffff,1.15);key.position.set(5,8,10);scene3.add(key);
    const rim=new THREE.PointLight(0x4fa3b8,2.4,44);rim.position.set(-6,-2,6);scene3.add(rim);
    window.__rim=rim;
    const geos=[new THREE.TorusGeometry(1.5,.48,16,60),new THREE.IcosahedronGeometry(1.25,0),new THREE.SphereGeometry(1.05,24,24),new THREE.TorusKnotGeometry(.9,.3,90,12)];
    const palette=[0x0c3752,0x123b52,0x1c5f78,0x0e2f45,0x2a4a5c];
    const far=[[-6,3,-11,0],[6,-2,-12,1],[0,5,-13,2],[-4,-4,-10,3],[5,4,-14,0]];
    const mid=[[-3,1.5,-5,1],[3.5,-1.5,-6,2],[0,-3,-4,0],[2.5,2.5,-5,3]];
    const near=lowPower?[]:[[-5,-1,-2,1]];
    [...far,...mid,...near].forEach((p,i)=>{
      const g=geos[p[3]],mat=new THREE.MeshStandardMaterial({color:palette[i%palette.length],roughness:.35,metalness:.3,transparent:true,opacity:i<far.length?.5:.8});
      const m=new THREE.Mesh(g,mat);m.position.set(p[0],p[1],p[2]);m.scale.setScalar((i<far.length?1.3:0.7)+Math.random()*0.5);
      m.userData={spin:(Math.random()-.5)*0.35,float:0.25+Math.random()*0.4,drift:(Math.random()-.5)*0.15,phase:Math.random()*Math.PI*2};
      scene3.add(m);
      if(i>=far.length && i<far.length+3) accentObjs.push(m);
    });
    window.addEventListener('resize',()=>{camera3.aspect=innerWidth/innerHeight;camera3.updateProjectionMatrix();renderer3.setSize(innerWidth,innerHeight);});
    if(matchMedia('(hover:hover)').matches) document.addEventListener('mousemove',e=>{mouseX=e.clientX/innerWidth-.5;mouseY=e.clientY/innerHeight-.5;});
    window.addEventListener('scroll',()=>{scrollT=scrollY/Math.max(1,document.body.scrollHeight-innerHeight);},{passive:true});
    clock3=new THREE.Clock();
    webglOK=true;
    requestAnimationFrame(animate3);
  }catch(err){ webglOK=false; }
}
function animate3(){
  requestAnimationFrame(animate3);
  const t=clock3.getElapsedTime();
  scene3.children.forEach(o=>{
    if(!o.userData||o.userData.spin===undefined) return;
    o.rotation.x+=o.userData.spin*0.01;
    o.rotation.y+=o.userData.spin*0.014;
    o.position.y+=Math.sin(t*o.userData.float+o.userData.phase)*0.0022;
    o.position.x+=Math.sin(t*0.2+o.userData.phase)*o.userData.drift*0.002;
  });
  camera3.position.x+=(mouseX*2.4-camera3.position.x)*0.03;
  camera3.position.y+=(-mouseY*1.4-scrollT*3.2-camera3.position.y)*0.03;
  camera3.lookAt(0,0,0);
  renderer3.render(scene3,camera3);
}
function renderParticles(){
  const colors=['#e2543f','#eebd4a','#e8823f','#5c9f63','#4fa3b8'];
  const spots=[[8,14],[85,10],[18,50],[92,42],[46,6],[62,60],[10,32],[88,64],[38,26],[70,20]];
  document.getElementById('particles').innerHTML = spots.map((s,i)=>`<div class="p" style="left:${s[0]}%;top:${s[1]}%;width:${6+((i*7)%10)}px;height:${6+((i*7)%10)}px;background:${colors[i%colors.length]};animation-delay:${i*0.6}s;animation-duration:${6+i%4}s;"></div>`).join('');
}
function updateAccent(hex){
  document.documentElement.style.setProperty('--accent',hex);
  document.getElementById('glow2').style.background=hex;
  if(webglOK){
    const c=new THREE.Color(hex);
    accentObjs.forEach(o=>o.material.color.lerp(c,1));
    if(window.__rim) window.__rim.color.lerp(c,1);
  }
}
let zoneObserver;
function observeWorlds(){
  if(zoneObserver) zoneObserver.disconnect();
  zoneObserver = new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        updateAccent(e.target.dataset.accent);
        if(e.target.dataset.i!==undefined){
          activeCat=+e.target.dataset.i;
          document.querySelectorAll('#cat-nav button').forEach(b=>{
            const on=+b.dataset.i===activeCat;
            b.classList.toggle('active',on);
            if(on) b.style.setProperty('--accent',e.target.dataset.accent);
          });
        }
      }
    });
  },{threshold:0.55});
  document.querySelectorAll('.zone').forEach(z=>zoneObserver.observe(z));
}

function renderAll(){
  renderHero();renderFeatured();renderWorlds();renderMenuGrid();renderBento();bindActionButtons();observeWorlds();
}
function setLang(l){
  lang=l;
  document.querySelectorAll('#langswitch button').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));
  renderAll();
}
document.querySelectorAll('#langswitch button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
document.getElementById('infoOverlay').addEventListener('click',e=>{if(e.target.id==='infoOverlay')closeInfo();});
document.getElementById('orderOverlay').addEventListener('click',e=>{if(e.target.id==='orderOverlay')closeOrder();});

document.getElementById('ctaExplore').addEventListener('click',()=>document.getElementById('featured').scrollIntoView({behavior:'smooth'}));
document.getElementById('ctaCats').addEventListener('click',()=>document.getElementById('categories').scrollIntoView({behavior:'smooth'}));

renderParticles();
setLang('uz');
initScene();
</script>
